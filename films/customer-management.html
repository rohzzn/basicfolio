<!doctype html>
<meta charset="utf-8">
<title>customer-management</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Customer Management App, a CRM with a PostgreSQL backend.
// Look: ink on kraft paper. Anchor: the card. Signature: a rolodex; cards flip over the top of the drum every
// three frames, and the one that stops at the front carries the name.
// t     dur   scene    what changes                                                    kit
// 0.0   2.0   rolodex  the drum spins, cards flipping over the top, the knob turning      flip by squash
// 2.0   1.3   store    the front card is pulled out and filed into the database drum       cylinder, arcs
// 3.3   1.7   card     the rolodex settles; the front card is written out                  writeOn

const PAL_CRM = makePalette({
  paper: '#d8c3a5', paperBand: null, ink: '#2d2016', night: '#241a12', chalk: '#fbf5ea', chalkDim: '#a08c75', guide: 'rgba(45,32,22,.3)',
  fills: ['#f3ead8', '#a47551', '#6b4f3a', '#e98a5a', '#7a9e9f'], shade: '#3a2a1c', light: '#fbf5ea', blush: '#e98a5a',
  accents: ['#e98a5a', '#7a9e9f', '#f2c14e', '#b3564a'], inks: ['#2d2016', '#e98a5a', '#7a9e9f'], finish: 'ink',
}, 'paperInk');

function card(c, x, y, w, h, squash, seed, o = {}) {
  c.save(); c.translate(x, y); c.scale(1, Math.max(.04, squash));
  draw(c, RR(-w / 2, -h / 2, w, h, 14), o.fill || PAL.fills[0], seed, { lw: 5, texo: { density: .25 } });
  if (o.hole !== false) { draw(c, CI(-w * .22, h / 2 - 22, 16), PAL.paper, seed + 1, { tex: false, lw: 3 }); draw(c, CI(w * .22, h / 2 - 22, 16), PAL.paper, seed + 2, { tex: false, lw: 3 }); }
  if (squash > .5) {
    draw(c, CI(-w * .3, -h * .1, 54), o.avatar || PAL.accents[1], seed + 3, { lw: 4, texo: { density: .4 } });
    c.save(); c.beginPath(); c.arc(-w * .3, -h * .1, 54, 0, TAU); c.clip(); bust(c, -w * .3, -h * .06, 46, PAL.fills[2], PAL.blush, seed + 4, {}); c.restore();
    if (o.name > 0) writeOn(c, 'customers', w * .06, -h * .05, o.name, { size: 120, ink: PAL.ink, ink2: PAL.blush, pen: PAL.blush });
    else { textBar(c, -w * .16, -h * .16, w * .38, alpha(PAL.ink, .6), 20); textBar(c, -w * .16, -h * .05, w * .28, alpha(PAL.ink, .3), 14); }
    for (let k = 0; k < 3; k++) textBar(c, -w * .38, h * .16 + k * 44, w * (.6 - k * .08), alpha(PAL.ink, .3), 13);
    draw(c, RR(w * .24, h * .12, 130, 46, 23), [PAL.accents[0], PAL.accents[1], PAL.accents[2]][seed % 3], seed + 8, { tex: false, lw: 3.4 });
  }
  c.restore();
}
function drum(c, tau, i, spin, nameP) {
  const cx = CX, cy = CY + 120, R = 300, cw = 760, ch = 420;
  // the barrel and its knobs
  for (const s of [-1, 1]) { draw(c, CI(cx + s * (cw / 2 + 40), cy + 60, 96), PAL.fills[1], 10 + s, { texo: { density: .5 } }); draw(c, CI(cx + s * (cw / 2 + 40), cy + 60, 34), PAL.fills[2], 20 + s, { tex: false, lw: 4 }); for (let k = 0; k < 8; k++) { const a = spin * 2 + k / 8 * TAU; stroke(c, [[cx + s * (cw / 2 + 40) + Math.cos(a) * 42, cy + 60 + Math.sin(a) * 42], [cx + s * (cw / 2 + 40) + Math.cos(a) * 88, cy + 60 + Math.sin(a) * 88]], 30 + k + s, { lw: 4, raw: true, alpha: .6 }); } }
  draw(c, PG([[cx - cw / 2 - 30, cy + 80], [cx + cw / 2 + 30, cy + 80], [cx + cw / 2 + 60, cy + 300], [cx - cw / 2 - 60, cy + 300]]), PAL.fills[2], 40, { lw: 6, texo: { density: .5 } });
  stroke(c, [[cx - cw / 2 - 20, cy + 140], [cx + cw / 2 + 20, cy + 140]], 41, { lw: 4, alpha: .5 });
  // cards around the drum: angle from the spin, squashed by how edge-on they are
  // a card at the front faces us (squash 1); one going over the top turns edge-on
  const n = 9;
  for (let k = n - 1; k >= 0; k--) {
    const a = spin + k / n * TAU, face = Math.cos(a);
    if (face < .03) continue;
    const y = cy + 40 - Math.sin(a) * 260;
    card(c, cx, y, cw * lerp(.9, 1, face), ch, Math.max(.05, face), 50 + k * 3, { fill: k === 0 ? tint(PAL.fills[0], .3) : PAL.fills[0], name: k === 0 ? nameP : 0 });
  }
  return [cx, cy];
}
function sceneRolodex(c, tau, i) {
  paper(c);
  const spin = -q12(tau) * 3.1;
  drum(c, tau, i, spin, 0);
  guides(c, CX, CY + 60, 380, 60, .5);
  for (let k = 0; k < 3; k++) if (pulse(i + k, 6, 3)) speedLines(c, CX + (k - 1) * 260, CY - 180, 0, 70 + k + i, 4, .35);
}
function cylinder(c, x, y, R, hgt, fillN, seed) {
  for (let k = 3; k >= 0; k--) { const yy = y + k * hgt / 3; draw(c, EL(x, yy, R, R * .3), k < fillN ? PAL.accents[1] : PAL.fills[0], seed + k, { lw: 5, texo: { density: .3 } }); }
  stroke(c, [[x - R, y], [x - R, y + hgt]], seed + 10, { lw: 5, raw: true }); stroke(c, [[x + R, y], [x + R, y + hgt]], seed + 11, { lw: 5, raw: true });
}
function sceneStore(c, tau, i) {
  paper(c);
  const spin = -3.1 * 2 + sm(0, .5, tau, easeOut) * .0;
  drum(c, tau, i, 0, 0);
  const p = sm(.1, .8, tau, easeIO);
  const [bx, by] = bez([CX, CY - 210], [CX - 300, CY - 500], [W - 420, 120], [W - 330, 300], p);
  c.save(); c.translate(bx, by); c.rotate(lerp(0, .5, p)); c.scale(lerp(1, .42, p), lerp(1, .42, p)); card(c, 0, 0, 760, 420, 1, 90, {}); c.restore();
  cylinder(c, W - 300, 380, 200, 330, Math.floor(p * 4), 100);
  for (let k = 1; k <= 3; k++) if (p > .3) dottedArc(c, W - 300, 470, 240 + k * 50, alpha(PAL.ink, .3), 110 + k, 18, 3);
  if (p >= 1) checkMark(c, W - 300, 800, 40, sm(.85, 1.1, tau), 120, { color: shade(PAL.accents[1], .2), lw: 9 });
}
function sceneCard(c, tau, i) {
  paper(c);
  drum(c, tau, i, 0, sm(.25, 1.1, tau, t => t));
  const z = lerp(1, 1.08, sm(0, 1.7, tau, easeIO));
  for (let r = 1; r <= 2; r++) if (tau > .8) dashedRing(c, CX, CY + 40, 440 + r * 70, alpha(PAL.accents[0], .35), 130 + r, [24, 18], 4);
}

portfolioFilm({
  look: 'ink', palette: PAL_CRM, poster: 4.6,
  beats: [
    { name: 'rolodex', dur: 2.0, fn: sceneRolodex },
    { name: 'store', dur: 1.3, fn: sceneStore },
    { name: 'card', dur: 1.7, fn: sceneCard },
  ],
});
</script>
