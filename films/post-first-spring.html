<!doctype html>
<meta charset="utf-8">
<title>post-first-spring</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Second Semester at UC - harder classes, more to run, and spring outside.
// Look: graphite and pressed colour on cream. Anchor: the branch. Signature: the term is a row of weeks that
// fills in while the branch above it comes into blossom, a bud per week.
// t     dur   scene   what changes                                                     kit
// 0.0   1.9   weeks   the week row fills; the branch buds, one bud a week                 grid, plant-ish
// 1.9   1.3   load    three course bars stack up and go over the line                      RR bars
// 3.2   1.9   bloom   the branch opens fully and the term is named                          writeOn

const PAL_FS = makePalette({
  paper: '#f5f2e8', paperBand: null, ink: '#2b2a24', night: '#26251f', chalk: '#ffffff', chalkDim: '#9d988c', guide: 'rgba(43,42,36,.3)',
  fills: ['#e8b7c4', '#cfd8bd', '#f0d9a8', '#b9c9d6', '#e2e0d4'], shade: '#6a655a', light: '#ffffff', blush: '#d98098',
  accents: ['#d98098', '#7f9a6a', '#c9a24a', '#6b86a8'], inks: ['#2b2a24', '#d98098'], finish: 'pencil',
}, 'pencilMinimal');
const WEEKS = 15;
const BRANCH = [];
(function build(x, y, len, a, d, t0) {
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
  BRANCH.push({ x, y, x2, y2, d, t0 });
  if (d <= 0) return;
  const r = rng(200 + BRANCH.length), n = d > 1 ? 2 : (r() < .5 ? 2 : 1);
  for (let k = 0; k < n; k++) build(x2, y2, len * (.68 + r() * .18), a + (k - (n - 1) / 2) * (.6 + r() * .25), d - 1, t0 + .18);
})(140, 300, 260, -.15, 3, 0);

function page(c) {
  paper(c);
  squig(c, 110, 130, 400, 1, { seed: 1, width: 3.4, amp: 8, color: alpha(PAL.ink, .45) });
  thread(c, W - 120, 3, PAL.accents[0], 2);
}
function branch(c, p, budP) {
  BRANCH.forEach((b, k) => {
    const g = clamp((p - b.t0) / .3, 0, 1); if (g <= 0) return;
    const x2 = lerp(b.x, b.x2, g), y2 = lerp(b.y, b.y2, g);
    stroke(c, [[b.x, b.y], [x2, y2]], 10 + k, { lw: 3 + b.d * 3, color: PAL.ink });
    if (b.d === 0 && g >= 1) {
      const bp = clamp(budP - (k % 5) * .1, 0, 1); if (bp <= 0) { dot(c, x2, y2, 7, PAL.accents[0]); return; }
      // a bud that opens into five small petals
      for (let s = 0; s < 5; s++) { const a = s / 5 * TAU + k; draw(c, EL(x2 + Math.cos(a) * 16 * bp, y2 + Math.sin(a) * 16 * bp, 15 * bp, 11 * bp, a), k % 2 ? PAL.fills[0] : PAL.light, 40 + k * 5 + s, { lw: 2.4, texo: { density: .2 } }); }
      dot(c, x2, y2, 6, PAL.accents[2]);
    }
  });
}
function weekRow(c, n, y) {
  for (let k = 0; k < WEEKS; k++) {
    const x = 180 + k * 74, on = k < n;
    draw(c, RR(x, y, 56, 56, 8), on ? PAL.fills[1] : PAL.light, 80 + k, { lw: 3, tex: on, texo: { density: .3 } });
    if (on && k % 5 === 4) crossMark(c, x + 28, y + 28, 16, 90 + k, { lw: 4, color: PAL.blush });
  }
  textBar(c, 180, y + 96, 150, alpha(PAL.ink, .35), 12);
}
function sceneWeeks(c, tau, i) {
  page(c);
  const p = sm(0, 1.7, tau, t => t);
  branch(c, p * 1.4, p * .5);
  weekRow(c, Math.floor(p * WEEKS), H - 260);
}
const COURSES = [[.72, 'a'], [.9, 'b'], [.55, 'c']];
function sceneLoad(c, tau, i) {
  page(c);
  branch(c, 1.4, .7);
  weekRow(c, WEEKS, H - 260);
  const x = W - 620, y = 300;
  COURSES.forEach(([v], k) => {
    const p = sm(k * .15, k * .15 + .5, tau, easeOut), by = y + k * 110;
    textBar(c, x, by - 30, 160, alpha(PAL.ink, .45), 14);
    draw(c, RR(x, by, 420, 52, 26), alpha(PAL.ink, .08), 100 + k, { tex: false, lw: 3 });
    if (p > .02) draw(c, RR(x, by, Math.max(52, 420 * v * p), 52, 26), [PAL.fills[3], PAL.blush, PAL.fills[2]][k], 110 + k, { lw: 3, texo: { density: .3 } });
  });
  // the line they are all pushing against
  stroke(c, [[x + 340, y - 60], [x + 340, y + 340]], 120, { lw: 4, dash: [14, 12], color: PAL.blush });
  textBar(c, x + 300, y - 90, 80, alpha(PAL.blush, .8), 12);
}
function sceneBloom(c, tau, i) {
  page(c);
  branch(c, 1.4, sm(0, .9, tau, easeOut) + .7);
  weekRow(c, WEEKS, H - 260);
  // petals coming off the branch
  const r = rng(140);
  for (let k = 0; k < 18; k++) { const x = 160 + r() * 900, y = ((tau * 200 + r() * 700) % 800) + 200; c.save(); c.translate(x, y); c.rotate(tau * 2 + k); draw(c, EL(0, 0, 14, 9, .3), k % 2 ? PAL.fills[0] : PAL.light, 150 + k, { tex: false, lw: 2.4 }); c.restore(); }
  writeOn(c, 'second semester', CX + 120, 720, sm(.25, 1.2, tau, t => t), { size: 130, ink: PAL.ink, ink2: PAL.blush, pen: PAL.blush });
}

portfolioFilm({
  look: 'pencil', palette: PAL_FS, poster: 4.9,
  beats: [
    { name: 'weeks', dur: 1.9, fn: sceneWeeks },
    { name: 'load', dur: 1.3, fn: sceneLoad },
    { name: 'bloom', dur: 1.9, fn: sceneBloom },
  ],
});
</script>
