<!doctype html>
<meta charset="utf-8">
<title>dsa-roadmap</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: DSA Roadmap, a data-structures interview prep roadmap.
// Look: flat screen print, hill country. Anchor: the walker. Signature: one continuous camera travelling up a
// winding road, milestone by milestone, to a signpost at the top.
// t     dur   scene  what happens
// 0.0   4.6  climb  the camera follows a dot up the road; each milestone flag plants itself
//                   as it is passed; at the top the signpost is painted "dsa roadmap"

const PAL_DSA = makePalette({
  paper: '#eef1e0', paperBand: null, ink: '#22332c', night: '#1a2a24', chalk: '#ffffff', chalkDim: '#86a091', guide: 'rgba(34,51,44,.3)',
  fills: ['#8cb369', '#5b8c5a', '#e9c46a', '#e76f51', '#457b9d', '#d8e2c4'], shade: '#22332c', light: '#fffdf2', blush: '#e76f51',
  accents: ['#e76f51', '#e9c46a', '#457b9d', '#5b8c5a'], inks: ['#5b8c5a', '#22332c', '#e9c46a'], finish: 'screen',
}, 'screenSea');

// the road as one long curve in world space, climbing to the right
const ROAD = [];
for (let k = 0; k <= 140; k++) { const u = k / 140; ROAD.push([-300 + u * 5200, 900 - u * 2100 + Math.sin(u * 7) * 170]); }
const at = u => ROAD[clamp(Math.round(u * 140), 0, 140)];
const STOPS = [.16, .36, .56, .76];
function world(c, tau, i, vis) {
  // hills behind, the road, the flags. The dot screens are clipped to the hills but only
  // ever laid over the visible rectangle: a world-sized box here is a quarter-million dots.
  // sky first: a sun that stays put and clouds strung along the climb
  const sun = CI(vis[0] + vis[2] * .78, vis[1] + vis[3] * .16, 110); c.fillStyle = PAL.fills[2]; c.fill(sun.path); tex(c, sun.path, sun.box, { color: PAL.blush, density: .3, seed: 2 });
  const cr = rng(77);
  for (let k = 0; k < 9; k++) { const cxk = -300 + k * 620, cyk = 500 - k * 190 + (k % 2) * 120;
    for (let b = 0; b < 3; b++) { const p = EL(cxk + (b - 1) * 70, cyk + (b === 1 ? -26 : 0), 90 - Math.abs(b - 1) * 22, 56 - Math.abs(b - 1) * 14); c.fillStyle = PAL.light; c.fill(p.path); } }
  const far = [[PAL.fills[5], 520], [PAL.fills[0], 260]];
  far.forEach(([col, amp], k) => { const pts = [[-400, 1400]]; for (let x = -400; x <= 5200; x += 90) pts.push([x, 700 - x * .36 + Math.sin(x / (700 - k * 200)) * amp * .4 - k * 120]); pts.push([5200, 1400]); const p = polyPath(pts); c.fillStyle = col; c.fill(p); tex(c, p, vis, { color: shade(col, .25), density: .22, seed: 5 + k, cell: 18 }); });
  const rp = ROAD.map(([x, y]) => [x, y]);
  stroke(c, rp, 10, { raw: true, lw: 78, color: PAL.fills[5] });
  stroke(c, rp, 11, { raw: true, lw: 62, color: PAL.light });
  for (let k = 0; k < 140; k += 4) { const [x, y] = ROAD[k]; stroke(c, [[x, y], ROAD[Math.min(139, k + 2)]], 12 + k, { lw: 8, color: alpha(PAL.ink, .25), raw: true }); }
  STOPS.forEach((u, k) => {
    const [x, y] = at(u), planted = tau > u * 4.2 - .1;
    if (!planted) return;
    const g = clamp((tau - (u * 4.2 - .1)) * 4, 0, 1);
    stroke(c, [[x, y - 30], [x, y - 30 - 200 * g]], 30 + k, { lw: 10, raw: true });
    draw(c, PG([[x + 6, y - 230 * g], [x + 190 * g, y - 200 * g], [x + 6, y - 150 * g]]), [PAL.fills[2], PAL.blush, PAL.fills[4], PAL.fills[1]][k], 40 + k, { lw: 5, texo: { density: .35 } });
    for (let d = 0; d < 3; d++) dot(c, x - 60 + d * 60, y + 80, 12, alpha(PAL.ink, .3));
  });
  // little trees along the way
  const r = rng(90);
  for (let k = 0; k < 16; k++) { const u = r(), [x, y] = at(u), sx = x + (r() - .5) * 700, sy = y + 120 + r() * 200; draw(c, PG([[sx, sy - 150], [sx + 60, sy], [sx - 60, sy]]), PAL.fills[1], 100 + k, { lw: 4, texo: { density: .3 } }); stroke(c, [[sx, sy], [sx, sy + 40]], 120 + k, { lw: 8, raw: true }); }
}
function walker(c, x, y, tau, i) {
  const [dy] = hop(tau * 2.2, 1, 40);
  c.save(); c.translate(x, y - 90 + dy);
  draw(c, CI(0, -60, 44), PAL.blush, 200, { lw: 5, texo: { density: .35 } });
  draw(c, RR(-34, -16, 68, 90, 20), PAL.fills[4], 201, { lw: 5, texo: { density: .3 } });
  for (const s of [-1, 1]) stroke(c, [[s * 20, 70], [s * 34 + Math.sin(tau * 9 + s) * 20, 130]], 202 + s, { lw: 9, raw: true });
  c.restore();
}
function scene(c, tau, i) {
  const u = clamp(sm(.1, 3.5, tau, easeIO), 0, 1), [wx, wy] = at(u);
  resetT(c); c.fillStyle = PAL.paper; c.fillRect(0, 0, W, H);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: PAL.fills[5], density: .14, cell: 16 });
  const z = lerp(1, .82, sm(3.2, 4.0, tau, easeIO));
  const camx = wx + 120 / z, camy = wy - 120;
  cam(c, camx, camy, z);
  world(c, tau, i, [camx - W / 2 / z, camy - H / 2 / z, W / z, H / z]);
  walker(c, wx, wy, tau, i);
  // the signpost at the top
  const [tx, ty] = at(1);
  const post = sm(3.3, 3.7, tau, easeOut);
  if (post > 0) {
    stroke(c, [[tx + 140, ty - 40], [tx + 140, ty - 40 - 420 * post]], 300, { lw: 18, raw: true });
    const by = ty - 380, bw = 900, bh = 230;
    if (post >= 1) {
      c.save(); c.translate(tx + 140, by); c.rotate(-.02);
      c.fillStyle = alpha(PAL.shade, .18); c.beginPath(); c.roundRect(-bw / 2 + 14, -bh / 2 + 18, bw, bh, 14); c.fill();
      draw(c, RR(-bw / 2, -bh / 2, bw, bh, 14), PAL.fills[2], 301, { lw: 7, texo: { density: .3 } });
      writeOn(c, 'dsa roadmap', 0, 44, sm(3.75, 4.6, tau, t => t), { size: 150, ink: PAL.ink, ink2: PAL.blush, pen: PAL.blush });
      c.restore();
    }
  }
  if (tau > 4.1) for (let k = 0; k < 4; k++) sparkle(c, tx - 300 + k * 240, ty - 700 + (k % 2) * 120, 30, PAL.fills[2], k + i * .2);
}

portfolioFilm({
  look: 'screen', palette: PAL_DSA, poster: 4.9, crf: 27,
  beats: [{ name: 'climb', dur: 4.8, fn: scene }],
});
</script>
