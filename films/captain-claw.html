<!doctype html>
<meta charset="utf-8">
<title>captain-claw</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Captain Claw, the 1997 pirate platformer ported to the browser, with online multiplayer.
// Look: flat screen print on parchment: navy sea, gold, a red stripe. Anchor: the ship.
// Signature: the ship's mainsail is a browser window. The game's own characters are never drawn; the film is
// the ship, the keys and the flag, and the name goes up the mast at the end.
// t     dur   scene  what changes                                                          kit
// 0.0   1.8   sail   the ship sails in on the swell, its sail a browser tab that loads       browser, waves
// 1.8   1.3   keys   four crates bob on the swell, W A S D, each pressed gold in turn         RR, hand
// 3.1   2.1   flag   back on the ship: a pennant runs up the mast and unfurls, the name       writeOn
//                    is written along it

const PAL_CLAW = makePalette({
  paper: '#efdfbd', paperBand: null, ink: '#1a1d36', night: '#141834', chalk: '#f6ead0', chalkDim: '#9a8a6a', guide: 'rgba(26,29,54,.35)',
  fills: ['#1f3f74', '#d8c49a', '#e3b341', '#b5352b', '#8b5a2f', '#2f63a8'], shade: '#141834', light: '#fbf3df', blush: '#b5352b',
  accents: ['#e3b341', '#b5352b', '#2f63a8', '#f6ead0'], inks: ['#1f3f74', '#b5352b', '#e3b341'], finish: 'screen',
}, 'screenSea');
const SEA = () => PAL.fills[0], GOLD = () => PAL.fills[2], RED = () => PAL.fills[3], WOOD = () => PAL.fills[4];
const SEA_Y = 860, SHIP_X = 600, KEY_SEA = 770;
const T = i => i / FPS_DRAW;
const swell = (x, t) => SEA_Y + Math.sin(x * .011 + t * 2.4) * 16 + Math.sin(x * .026 - t * 1.6) * 6;

function sky(c) {
  paper(c);
  const sun = CI(190, 300, 118); c.fillStyle = tint(GOLD(), .25); c.fill(sun.path); tex(c, sun.path, sun.box, { color: GOLD(), density: .55, seed: 3 });
  stroke(c, ellPts(190, 300, 118, 118, 0, 60), 4, { raw: true, close: true, lw: 5 });
  for (const [x, y, k] of [[1150, 430, 1], [420, 150, .8]]) stroke(c, arcPts(x, y, 70 * k, 34 * k, Math.PI, TAU, 16).concat(arcPts(x + 90 * k, y - 6, 60 * k, 40 * k, Math.PI, TAU, 16)), 6 + x, { raw: true, lw: 4, alpha: .55 });
}
function sea(c, t, top = SEA_Y) {
  const pts = []; for (let x = -20; x <= W + 20; x += 24) pts.push([x, swell(x, t) + (top - SEA_Y)]);
  const p = polyPath(pts.concat([[W + 20, H + 20], [-20, H + 20]])); c.fillStyle = SEA(); c.fill(p);
  stroke(c, pts, 7, { raw: true, lw: 6 });
  // crests riding the swell, light strokes
  for (let k = 0; k < 9; k++) {
    const x = ((k * 197 + t * 90) % (W + 240)) - 120, y = top + 70 + (k % 3) * 74;
    stroke(c, arcPts(x, y, 46, 12, Math.PI * 1.1, Math.PI * 1.9, 10), 30 + k, { raw: true, lw: 5, color: tint(PAL.fills[5], .35), alpha: .9 });
  }
}
// the hull, mast and sail in ship coordinates (waterline at y = 0)
function ship(c, t, x, o = {}) {
  const bob = Math.sin(t * 2.4 + x * .011) * 12, rot = Math.sin(t * 2.4 - .7) * .022;
  c.save(); c.translate(x, SEA_Y + bob); c.rotate(rot);
  // rigging
  stroke(c, [[0, -792], [-380, -150]], 50, { lw: 3.4 }); stroke(c, [[0, -792], [474, -196]], 51, { lw: 3.4 });
  // mast
  draw(c, RR(-13, -806, 26, 700, 8), WOOD(), 52, { lw: 4, tex: false });
  // the sail is a browser window, lashed to the mast
  const [bx, by, bw, bh] = browser(c, -262, -600, 524, 330, 60, { tex: false });
  c.fillStyle = PAL.night; c.fillRect(bx + 3, by + 2, bw - 6, bh - 5);
  if (o.sail) o.sail(c, bx, by, bw, bh);
  // hull
  const hull = PG([[-404, -176], [-312, -128], [352, -128], [462, -196], [372, 46], [-312, 46]]);
  draw(c, hull, WOOD(), 70, { lw: 6, texo: { density: .32, color: shade(WOOD(), .45) } });
  c.save(); c.clip(hull.path); c.fillStyle = RED(); c.fillRect(-440, -92, 940, 34); c.restore();
  stroke(c, [[-330, -104], [400, -104]], 71, { lw: 3, alpha: .5 });
  for (let k = 0; k < 4; k++) draw(c, CI(-170 + k * 140, -26, 17), PAL.night, 72 + k, { tex: false, lw: 4 });
  stroke(c, [[450, -186], [590, -270]], 73, { lw: 9, color: WOOD() }); stroke(c, [[450, -186], [590, -270]], 74, { lw: 3 });
  if (o.flag) o.flag(c);
  c.restore();
}

// 1. the ship sails in; the tab loads, then waits on its Play button
function sceneSail(c, tau, i) {
  const t = T(i), x = lerp(-560, SHIP_X, sm(0, 1.35, tau, easeOut));
  sky(c);
  ship(c, t, x, {
    sail: (c, bx, by, bw, bh) => {
      const p = sm(.35, 1.15, tau, easeIO), cx = bx + bw / 2, cy = by + bh / 2;
      if (p < 1) {
        draw(c, RR(cx - 160, cy - 14, 320, 28, 14), null, 81, { lw: 3, lc: PAL.chalkDim });
        if (p > 0) { c.fillStyle = GOLD(); c.beginPath(); c.roundRect(cx - 154, cy - 8, 308 * p, 16, 8); c.fill(); }
      } else {
        const s = easeBack(sm(1.15, 1.45, tau, t => t));
        c.save(); c.translate(cx, cy); c.scale(s, s);
        draw(c, RR(-110, -48, 220, 96, 22), GOLD(), 82, { lw: 5, tex: false });
        c.fillStyle = PAL.night; c.beginPath(); c.moveTo(-18, -26); c.lineTo(28, 0); c.lineTo(-18, 26); c.closePath(); c.fill();
        c.restore();
      }
    },
  });
  sea(c, t);
}

// 2. the keys, floating like crates; each one is pressed into the swell and lights gold
const KEYS = ['W', 'A', 'S', 'D'];
function sceneKeys(c, tau, i) {
  const t = T(i);
  sky(c);
  sea(c, t, KEY_SEA);
  KEYS.forEach((k, n) => {
    const x = CX + (n - 1.5) * 326, lit = tau >= n * .26, press = sm(n * .26, n * .26 + .1, tau, easeOut) * (1 - sm(n * .26 + .1, n * .26 + .3, tau, easeIO));
    const y = swell(x, t) - SEA_Y + KEY_SEA - 70 + press * 40;
    c.save(); c.translate(x, y); c.rotate(Math.sin(t * 2 + n * 1.3) * .05);
    if (!BP()) { c.fillStyle = alpha(PAL.shade, .25); c.beginPath(); c.roundRect(-122, -114, 256, 256, 32); c.fill(); }
    draw(c, RR(-132, -132, 264, 264, 32), lit ? GOLD() : PAL.light, 100 + n, { lw: 6, tex: lit, texo: { density: .35, color: shade(GOLD(), .35) } });
    stroke(c, rrPts(-100, -100, 200, 200, 20), 110 + n, { raw: true, close: true, lw: 3, alpha: .45 });
    hand(c, k, 0, 58, { size: 170, ink: lit ? PAL.night : PAL.ink, ink2: lit ? RED() : null, weight: 'bold' });
    c.restore();
    if (lit && tau < n * .26 + .5) for (let s = 0; s < 3; s++) sparkle(c, x + [-150, 150, 140][s], y + [-150, -160, -40][s], 24 + s * 6, s % 2 ? RED() : GOLD(), t * 3 + s);
  });
  // the swell in front of the crates, so they sit in the water
  const front = []; for (let x = -20; x <= W + 20; x += 24) front.push([x, swell(x, t + .4) - SEA_Y + KEY_SEA + 24]);
  const fp = polyPath(front.concat([[W + 20, H + 20], [-20, H + 20]])); c.fillStyle = SEA(); c.fill(fp);
  stroke(c, front, 120, { raw: true, lw: 6 });
}

// 3. the pennant runs up the mast, unfurls, and the name is written along it
function sceneFlag(c, tau, i) {
  const t = T(i);
  sky(c);
  ship(c, t, SHIP_X, {
    sail: (c, bx, by, bw, bh) => {
      const cx = bx + bw / 2, cy = by + bh / 2;
      draw(c, RR(cx - 110, cy - 48, 220, 96, 22), GOLD(), 82, { lw: 5, tex: false });
      c.fillStyle = PAL.night; c.beginPath(); c.moveTo(cx - 18, cy - 26); c.lineTo(cx + 28, cy); c.lineTo(cx - 18, cy + 26); c.closePath(); c.fill();
    },
    flag: (c) => {
      const up = sm(0, .45, tau, easeOut), top = lerp(-330, -800, up), unfurl = sm(.4, 1.0, tau, easeOut);
      const len = lerp(110, 640, unfurl), hgt = lerp(70, 158, unfurl);
      const edge = [], bottom = [];
      for (let u = 0; u <= 1.0001; u += .05) { const x = 14 + u * len, w = Math.sin(u * 7 - t * 7) * 10 * u; edge.push([x, top + w]); bottom.push([x, top + hgt + w - u * u * 26]); }
      const pts = edge.concat(bottom.reverse());
      draw(c, PG(pts), PAL.night, 130, { lw: 6, tex: false });
      if (unfurl >= 1) {
        stroke(c, edge.map(([x, y]) => [x, y + 16]), 131, { raw: true, lw: 3, color: GOLD(), alpha: .8 });
        writeOn(c, 'captain claw', 14 + len / 2, top + hgt / 2 + 28, sm(1.0, 1.85, tau, t => t), { size: 92, ink: GOLD(), ink2: RED(), pen: PAL.light });
      }
    },
  });
  sea(c, t);
  if (tau > 1.85) for (let s = 0; s < 4; s++) sparkle(c, SHIP_X + 150 + s * 160, 34 + (s % 2) * 230, 20 + (s % 3) * 8, s % 2 ? RED() : GOLD(), t * 4 + s);
}

portfolioFilm({
  look: 'screen', palette: PAL_CLAW, poster: 1.6, crf: 27,
  beats: [
    { name: 'sail', dur: 1.8, fn: sceneSail },
    { name: 'keys', dur: 1.3, fn: sceneKeys },
    { name: 'flag', dur: 2.1, fn: sceneFlag },
  ],
});
</script>
