<!doctype html>
<meta charset="utf-8">
<title>codechef-mrec</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: CodeChef MREC, the college chapter site.
// Look: ink in a warm kitchen. Anchor: the pot. Signature: ingredients drop into the pot and the steam that
// comes off it curls into the name.
// t     dur   scene    what changes                                                     kit
// 0.0   1.7   kitchen  the pot on the stove; three ingredients drop in and splash          loops, ringsOut
// 1.7   1.2   stir     the ladle stirs, the surface swirling, the flame turning up          arcs
// 2.9   2.0   steam    steam rises and writes "codechef" over the pot                       writeOn

const PAL_CC = makePalette({
  paper: '#f6e7cd', paperBand: 'rgba(255,238,200,.5)', ink: '#3b2413', night: '#2a1a0e', chalk: '#fff6e6', chalkDim: '#a5876a', guide: 'rgba(59,36,19,.3)',
  fills: ['#d87b3c', '#a8542a', '#e8b96a', '#7d9a5c', '#c3452f'], shade: '#5a3418', light: '#fff6e6', blush: '#c3452f',
  accents: ['#c3452f', '#7d9a5c', '#e8b96a', '#5f8fa8'], inks: ['#3b2413', '#c3452f', '#7d9a5c'], finish: 'ink',
}, 'paperInk');
const POT = [CX, 700];

function kitchen(c, flame, i) {
  paper(c);
  // the wall, a shelf, the stove top
  const wall = rectPath(0, 0, W, 780); c.fillStyle = tint(PAL.fills[2], .45); c.fill(wall); tex(c, wall, [0, 0, W, 780], { density: .2, seed: 1 });
  for (let x = -40; x < W + 80; x += 160) for (let y = 60; y < 700; y += 160) stroke(c, rrPts(x + ((y / 160) % 2) * 80, y, 150, 150, 4), 2 + x + y, { raw: true, close: true, lw: 3, color: alpha(PAL.shade, .18) });
  stroke(c, [[0, 300], [W, 300]], 3, { lw: 10, color: PAL.fills[1] });
  for (let k = 0; k < 5; k++) { const x = 120 + k * 120; draw(c, RR(x, 200, 84, 96, 10), [PAL.fills[3], PAL.fills[2], PAL.blush, PAL.fills[3], PAL.fills[2]][k], 10 + k, { lw: 4, texo: { density: .3 } }); }
  const stove = rectPath(-10, 780, W + 20, 320); c.fillStyle = PAL.fills[1]; c.fill(stove); tex(c, stove, [0, 780, W, 320], { density: .4, seed: 20 });
  stroke(c, [[-10, 780], [W + 10, 780]], 21, { lw: 6 });
  // the burner flame under the pot
  for (let k = 0; k < 7; k++) { const a = -Math.PI / 2 + (k - 3) * .22, h = (60 + (k % 2) * 30) * flame * (pulse(i + k, 3, 2) ? 1.15 : .9);
    draw(c, PG([[POT[0] + (k - 3) * 44 - 18, 800], [POT[0] + (k - 3) * 44, 800 - h], [POT[0] + (k - 3) * 44 + 18, 800]]), k % 2 ? PAL.fills[0] : PAL.accents[2], 30 + k, { tex: false, lw: 3 }); }
}
function pot(c, level, swirl, i) {
  const [x, y] = POT, w = 520, h = 300;
  draw(c, PG([[x - w / 2, y - h / 2], [x + w / 2, y - h / 2], [x + w / 2 - 40, y + h / 2], [x - w / 2 + 40, y + h / 2]]), PAL.fills[1], 40, { lw: 7, texo: { density: .5 } });
  for (const s of [-1, 1]) stroke(c, arcPts(x + s * (w / 2 + 10), y - h / 2 + 60, 70, 50, s > 0 ? -1.4 : Math.PI + 1.4, s > 0 ? 1.4 : Math.PI - 1.4, 18), 41 + s, { raw: true, lw: 14 });
  // the surface, swirling
  const top = EL(x, y - h / 2, w / 2 - 6, 52);
  draw(c, top, PAL.fills[0], 44, { lw: 5, texo: { density: .6 } });
  c.save(); c.clip(top.path);
  for (let k = 0; k < 3; k++) { const pts = []; for (let a = 0; a <= TAU; a += .2) { const rr = (60 + k * 60) * (1 + .12 * Math.sin(a * 3 + swirl)); pts.push([x + Math.cos(a + swirl + k) * rr, y - h / 2 + Math.sin(a + swirl + k) * rr * .19]); } stroke(c, pts, 45 + k, { raw: true, close: true, lw: 5, color: k % 2 ? PAL.accents[2] : PAL.blush, alpha: .8 }); }
  c.restore();
}
const DROPS = [[.25, PAL.fills[3], 'square'], [.6, PAL.blush, 'round'], [.95, PAL.accents[2], 'tri']];
function sceneKitchen(c, tau, i) {
  kitchen(c, .8, i);
  pot(c, 1, tau * 2, i);
  DROPS.forEach(([t0, col, kind], k) => {
    if (tau < t0 - .5) return;
    const p = clamp((tau - (t0 - .5)) / .5, 0, 1), y = lerp(-120, POT[1] - 170, easeIn(p)), x = POT[0] + (k - 1) * 120;
    if (p < 1) { c.save(); c.translate(x, y); c.rotate(p * 6 * (k % 2 ? 1 : -1));
      if (kind === 'square') draw(c, RR(-40, -40, 80, 80, 10), col, 60 + k, { lw: 4, texo: { density: .4 } });
      if (kind === 'round') draw(c, CI(0, 0, 44), col, 61 + k, { lw: 4, texo: { density: .4 } });
      if (kind === 'tri') draw(c, PG([[-46, 36], [46, 36], [0, -46]]), col, 62 + k, { lw: 4, texo: { density: .4 } });
      c.restore(); }
    else ringsOut(c, x, POT[1] - 150, tau - t0, { every: 1 / 6, t1: .25, speed: 400, colors: [PAL.accents[2], PAL.blush], width: 5, seed: 70 + k, max: 240 });
  });
}
function sceneStir(c, tau, i) {
  kitchen(c, 1.15, i);
  pot(c, 1, 3.4 + tau * 6, i);
  const a = tau * 7, lx = POT[0] + Math.cos(a) * 150, ly = POT[1] - 150 + Math.sin(a) * 30;
  stroke(c, [[lx, ly], [lx + 120, ly - 420]], 80, { lw: 16 });
  draw(c, EL(lx, ly, 70, 30, .2), PAL.fills[2], 81, { lw: 5, texo: { density: .4 } });
  for (let k = 0; k < 3; k++) if (pulse(i + k * 2, 5, 2)) { const b = a + k * 2; loops(c, POT[0] + Math.cos(b) * 120, POT[1] - 190, b, 90 + k + i, .5, [PAL.accents[2], PAL.blush]); }
}
function steamPath(c, tau, i) {
  // three curls of steam, quantised, rising off the pot
  for (let k = 0; k < 3; k++) {
    const pts = []; const x0 = POT[0] + (k - 1) * 150;
    for (let t = 0; t <= 1; t += .05) { const y = POT[1] - 200 - t * 520; pts.push([x0 + Math.sin(t * 6 + q12(tau) * 3 + k) * (40 + t * 90), y]); }
    stroke(c, pts, 100 + k, { raw: true, lw: 12, color: alpha(PAL.light, .55) });
    stroke(c, pts, 110 + k, { raw: true, lw: 5, color: alpha(PAL.chalkDim, .5) });
  }
}
function sceneSteam(c, tau, i) {
  kitchen(c, 1, i);
  pot(c, 1, 9 + tau * 3, i);
  steamPath(c, tau, i);
  const p = sm(.2, 1.4, tau, t => t);
  writeOn(c, 'codechef', CX, 330, p, { size: 190, ink: PAL.light, ink2: alpha(PAL.chalkDim, .8), pen: PAL.light });
  if (p >= 1) writeOn(c, 'mrec', CX, 470, sm(1.35, 1.8, tau, t => t), { size: 110, ink: PAL.light, ink2: null, pen: null });
}

portfolioFilm({
  look: 'ink', palette: PAL_CC, poster: 1.2,
  beats: [
    { name: 'kitchen', dur: 1.7, fn: sceneKitchen },
    { name: 'stir', dur: 1.2, fn: sceneStir },
    { name: 'steam', dur: 2.0, fn: sceneSteam },
  ],
});
</script>
