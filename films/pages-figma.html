<!doctype html>
<meta charset="utf-8">
<title>pages-figma</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Pages, a Figma plugin for managing pages in big files.
// Look: riso, overprinted inks on cream. Anchor: the pink-tabbed page. Signature: a riffle shuffle; pages keep
// cutting from the back of the deck to the front, one every three frames.
// t     dur   scene     what changes                                                    kit
// 0.0   1.8   shuffle   the deck riffles, tabs flashing past                             playCard-style stack
// 1.8   1.5   reorder   the list: the pink page lifts out and slides to the top           RR, easeIO
// 3.3   1.7   cover     the pink page comes to the front and its title is written         writeOn

const PAL_PG = makePalette({
  paper: '#f3ede4', paperBand: null, ink: '#2b2350', night: '#241d44', chalk: '#f7f2e6', chalkDim: '#8b82b8', guide: 'rgba(43,35,80,.35)',
  fills: ['#ff48b0', '#0078bf', '#ffe800', '#00a95c', '#ff6c2f', '#765ba7'], shade: '#2b2350', light: '#fffdf6', blush: '#ff48b0',
  accents: ['#ff48b0', '#0078bf', '#ffe800', '#00a95c'], inks: ['#0078bf', '#ff48b0', '#ffe800'], finish: 'riso',
}, 'risoPop');
const TAB = () => [PAL.fills[1], PAL.fills[4], PAL.fills[3], PAL.fills[2], PAL.fills[0], PAL.fills[5]];

function page(c, x, y, rot, k, seed, s = 1, title = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.fillStyle = alpha(PAL.shade, .16); c.beginPath(); c.roundRect(-230 + 16, -310 + 18, 460, 620, 18); c.fill();
  draw(c, RR(-230, -310, 460, 620, 18), PAL.light, seed, { lw: 6, tex: false });
  const band = rectPath(-230, -310, 460, 96);
  c.save(); c.clip(roundRectPath(-230, -310, 460, 620, 18)); c.fillStyle = TAB()[k]; c.fill(band); tex(c, band, [-230, -310, 460, 96], { seed: seed + 1, density: .45 }); c.restore();
  stroke(c, [[-230, -214], [230, -214]], seed + 2, { lw: 5 });
  if (title > 0) writeOn(c, 'pages', 0, -238, title, { size: 120, ink: PAL.light, ink2: PAL.fills[1], pen: PAL.fills[1] });
  else textBar(c, -150, -262, 300, alpha(PAL.light, .85), 22);
  draw(c, RR(-170, -160, 340, 200, 10), tint(TAB()[k], .5), seed + 3, { lw: 4, texo: { density: .5 } });
  squig(c, -170, 110, 340, 4, { seed: seed + 4, lineH: 40, width: 3.4, amp: 9 });
  for (let d = 0; d < 3; d++) draw(c, CI(-120 + d * 120, 240, 28), TAB()[(k + d + 1) % 6], seed + 10 + d, { lw: 4, texo: { density: .4 } });
  c.restore();
}
function sceneShuffle(c, tau, i) {
  paper(c);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: PAL.fills[2], density: .16, cell: 15 });
  const step = Math.floor(tau * 12 / 3), n = 6;
  for (let d = 0; d < n; d++) {
    const k = (d + step) % n, depth = d / (n - 1);
    const flying = d === n - 1, f = flying ? ((tau * 12 / 3) % 1) : 0;
    const x = CX + lerp(-26, 26, depth) + (flying ? Math.sin(f * Math.PI) * 420 : 0);
    const y = CY + lerp(40, -30, depth) - (flying ? Math.sin(f * Math.PI) * 120 : 0);
    page(c, x, y, lerp(.06, -.04, depth) + (flying ? f * .5 : 0), k, 20 + k * 7, lerp(.86, 1, depth));
  }
  for (let r = 1; r <= 3; r++) dashedRing(c, CX, CY, 420 + r * 60, alpha(PAL.ink, .25), 60 + r, [20, 16], 3);
}

const MOVE = 4;
function sceneReorder(c, tau, i) {
  paper(c);
  const x = CX - 440, y = 100, w = 880, h = 880, rowH = 130, p = sm(.3, 1.05, tau, easeIO);
  c.fillStyle = alpha(PAL.shade, .16); c.beginPath(); c.roundRect(x + 18, y + 20, w, h, 24); c.fill();
  draw(c, RR(x, y, w, h, 24), PAL.light, 10, { lw: 6, tex: false });
  textBar(c, x + 50, y + 60, 260, alpha(PAL.ink, .6), 22);
  for (let k = 0; k < 6; k++) {
    let slot = k; if (k === MOVE) slot = lerp(MOVE, 0, p); else if (k < MOVE) slot = k + p;
    const ry = y + 110 + slot * rowH, isM = k === MOVE, lift = isM && tau > .15 && tau < 1.2;
    c.save();
    if (lift) { c.translate(x + w / 2, ry + rowH / 2); c.rotate(-.02); c.scale(1.04, 1.04); c.translate(-x - w / 2, -ry - rowH / 2); c.fillStyle = alpha(PAL.shade, .22); c.beginPath(); c.roundRect(x + 44, ry + 26, w - 68, rowH - 20, 18); c.fill(); }
    draw(c, RR(x + 30, ry + 10, w - 60, rowH - 20, 18), isM ? tint(PAL.fills[0], .72) : PAL.light, 20 + k, { lw: isM ? 6 : 3.6, tex: isM, texo: { density: .3 } });
    draw(c, RR(x + 60, ry + 38, 54, 54, 12), TAB()[k], 30 + k, { tex: false, lw: 4 });
    textBar(c, x + 148, ry + rowH / 2, 240 + ((k * 61) % 150), alpha(PAL.ink, isM ? .7 : .4), 18);
    for (let d = 0; d < 3; d++) dot(c, x + w - 90, ry + 42 + d * 20, 6, alpha(PAL.ink, .4));
    c.restore();
  }
  if (tau > 1.1) checkMark(c, x + w - 170, y + 175, 34, sm(1.1, 1.35, tau), 50, { color: PAL.fills[3], lw: 8 });
}

function sceneCover(c, tau, i) {
  paper(c);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: PAL.fills[2], density: .16, cell: 15 });
  const come = sm(0, .5, tau, easeOut);
  for (let d = 0; d < 4; d++) page(c, CX + 260 + d * 34, CY + 30 - d * 12, .05 + d * .02, [1, 3, 2, 5][d], 70 + d, .8);
  page(c, lerp(CX + 330, CX - 60, come), lerp(CY + 20, CY, come), lerp(.14, -.03, come), 4, 90, lerp(.8, 1.2, come), sm(.55, 1.35, tau, t => t));
  if (tau > .5) for (let r = 1; r <= 2; r++) dashedRing(c, CX - 60, CY, 460 + r * 70, alpha(PAL.fills[0], .4), 95 + r, [22, 18], 4);
}

portfolioFilm({
  look: 'riso', palette: PAL_PG, poster: 4.6, crf: 31,
  beats: [
    { name: 'shuffle', dur: 1.8, fn: sceneShuffle },
    { name: 'reorder', dur: 1.5, fn: sceneReorder },
    { name: 'cover', dur: 1.7, fn: sceneCover },
  ],
});
</script>
