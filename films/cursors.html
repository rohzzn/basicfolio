<!doctype html>
<meta charset="utf-8">
<title>cursors</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Cursors, one-click cursor packs for Windows.
// Look: screen, flat poster colours. Anchor: the arrow. Signature: every click is a cut to a new colour.
// t     dur   scene    what changes                                                      kit
// 0.0   2.0   clicks   a giant arrow on a full-bleed colour; each click cuts colour+skin    cursor, ringsOut, dotScreen
// 2.0   1.5   packs    nine pack cards flip in one after another, a selection lands         RR, scaleX flip
// 3.5   1.5   name     the arrow itself writes "cursors", then double-clicks it             writeOn (arrow as pen)

const PAL_CUR = makePalette({
  paper: '#f2ede3', paperBand: null, ink: '#1b1a2e', night: '#1b1a2e', chalk: '#fbf8f1', chalkDim: '#8e8ca8', guide: 'rgba(27,26,46,.35)',
  fills: ['#ff5a36', '#2f5bea', '#ffd23f', '#17b890', '#f3a6c8', '#1b1a2e'], shade: '#1b1a2e', light: '#fbf8f1', blush: '#f3a6c8',
  accents: ['#ff5a36', '#2f5bea', '#ffd23f', '#17b890'], inks: ['#2f5bea', '#ff5a36', '#ffd23f'], finish: 'screen',
}, 'screenSea');

// [background, arrow fill, arrow line]
const SKINS = () => [[PAL.fills[1], PAL.fills[2], PAL.ink], [PAL.fills[0], PAL.light, PAL.ink], [PAL.fills[3], PAL.ink, PAL.light], [PAL.fills[2], PAL.fills[4], PAL.ink]];
const CLICK_EVERY = .5;
function sceneClicks(c, tau, i) {
  const k = Math.floor(tau / CLICK_EVERY), [bg, fill, line] = SKINS()[k % 4], local = tau - k * CLICK_EVERY;
  paper(c, bg, null);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: shade(bg, .25), density: .16, cell: 16 });
  const tx = CX - 190, ty = CY - 330, press = local < 2 / 12;
  // an echo of the previous skin, offset, like a print that slipped
  const [, pf] = SKINS()[(k + 3) % 4];
  cursor(c, tx + 26, ty + 22, 720, pf, 10 + k, { line: false, tex: false });
  c.save(); if (press) { c.translate(tx, ty); c.scale(.92, .92); c.translate(-tx, -ty); }
  cursor(c, tx, ty, 720, fill, 20 + k, { lc: line, lw: 10, texo: { color: shade(fill, .3), density: .3 } });
  c.restore();
  ringsOut(c, tx, ty, local, { every: 1 / 12, t1: .17, speed: 900, colors: [line, fill], width: 9, seed: 30 + k, r0: 20 });
  for (let s = 0; s < 6; s++) { const a = -2.4 + s * .28, r0 = 70 + local * 500, r1 = r0 + 60; if (local < .25) stroke(c, [[tx + Math.cos(a) * r0, ty + Math.sin(a) * r0], [tx + Math.cos(a) * r1, ty + Math.sin(a) * r1]], 40 + s, { lw: 8, color: line, raw: true }); }
}

const PACKS = () => [
  [PAL.light, PAL.ink], [PAL.ink, PAL.light], [PAL.fills[0], PAL.ink], [PAL.fills[4], PAL.ink], [PAL.fills[1], PAL.light],
  [PAL.fills[2], PAL.ink], [PAL.fills[3], PAL.ink], [PAL.light, PAL.fills[0]], [PAL.fills[2], PAL.fills[1]],
];
function scenePacks(c, tau, i) {
  paper(c);
  const cw = 330, ch = 250, gx = 34, gy = 34, x0 = CX - (3 * cw + 2 * gx) / 2, y0 = CY - (3 * ch + 2 * gy) / 2;
  const sel = 4, landed = tau > 1.05;
  PACKS().forEach(([f, l], k) => {
    const x = x0 + (k % 3) * (cw + gx), y = y0 + Math.floor(k / 3) * (ch + gy);
    const flip = sm(k * .07, k * .07 + .22, tau, easeOut);
    if (flip <= 0) return;
    c.save(); c.translate(x + cw / 2, y + ch / 2); c.scale(Math.max(.02, flip), 1); c.translate(-cw / 2, -ch / 2);
    const on = landed && k === sel;
    draw(c, RR(0, 0, cw, ch, 26), on ? PAL.fills[2] : PAL.light, 50 + k, { tex: on, lw: on ? 7 : 5, texo: { density: .25 } });
    cursor(c, cw * .38, ch * .14, 170, f, 60 + k, { lc: l, lw: 6, tex: false });
    textBar(c, cw * .26, ch * .86, cw * .48, alpha(PAL.ink, .3), 14);
    c.restore();
  });
  if (landed) { const x = x0 + (sel % 3) * (cw + gx), y = y0 + Math.floor(sel / 3) * (ch + gy); ringsOut(c, x + cw / 2, y + ch / 2, tau - 1.05, { every: 1 / 6, t1: .2, speed: 700, colors: [PAL.fills[0], PAL.fills[1]], width: 7, seed: 70, r0: 150 }); cursor(c, x + cw * .7, y + ch * .6, 150, PAL.ink, 71, { lc: PAL.light, lw: 6, tex: false }); }
}

function sceneName(c, tau, i) {
  paper(c, PAL.fills[2], null);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: shade(PAL.fills[2], .2), density: .16, cell: 16 });
  const p = sm(0, .9, tau, t => t);
  const [px, py] = writeOn(c, 'cursors', CX, CY + 80, p, { size: 300, ink: PAL.ink, ink2: PAL.fills[0], pen: null });
  if (tau > 1.0) { const u = sm(1.0, 1.2, tau); stroke(c, [[CX - 440, CY + 150], [CX - 440 + 880 * u, CY + 150]], 80, { lw: 12, color: PAL.fills[1] }); stroke(c, [[CX - 400, CY + 185], [CX - 400 + 800 * sm(1.1, 1.3, tau), CY + 185]], 81, { lw: 8, color: PAL.fills[0] }); }
  const done = p >= 1, cx = done ? CX + 470 : px, cy = done ? CY + 60 : py;
  const press = (tau > 1.0 && tau < 1.0 + 1 / 12) || (tau > 1.17 && tau < 1.17 + 1 / 12);
  c.save(); if (press) { c.translate(cx, cy); c.scale(.9, .9); c.translate(-cx, -cy); }
  cursor(c, cx, cy, 190, PAL.light, 82, { lc: PAL.ink, lw: 7, tex: false });
  c.restore();
  if (tau > 1.0) ringsOut(c, cx, cy, tau - 1.0, { every: 1 / 6, t1: .2, speed: 600, colors: [PAL.ink, PAL.fills[0]], width: 6, seed: 83, r0: 20 });
}

portfolioFilm({
  look: 'screen', palette: PAL_CUR, poster: .6,
  beats: [
    { name: 'clicks', dur: 2.0, fn: sceneClicks },
    { name: 'packs', dur: 1.5, fn: scenePacks },
    { name: 'name', dur: 1.5, fn: sceneName },
  ],
});
</script>
