<!doctype html>
<meta charset="utf-8">
<title>pokemon-platformer</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Pokemon 2d Platformer, a 2D platformer in that style.
// Look: riso, four inks, bright. Anchor: the little runner. Signature: a side-scroller - three parallax layers
// at three speeds, the runner hopping platforms, ending at the level sign that carries the name.
// t     dur   scene  what happens
// 0.0   3.2   run    the runner hops along platforms, coins popping, layers sliding past
// 3.2   1.8   sign   it lands by the level sign, which is painted "platformer"

const PAL_PF = makePalette({
  paper: '#dff3ff', paperBand: null, ink: '#1b2a4a', night: '#14203a', chalk: '#ffffff', chalkDim: '#7e94b8', guide: 'rgba(27,42,74,.3)',
  fills: ['#ffd23f', '#3bc47a', '#ff5d5d', '#3a86ff', '#b28cff', '#ffffff'], shade: '#1b2a4a', light: '#ffffff', blush: '#ff5d5d',
  accents: ['#ffd23f', '#ff5d5d', '#3bc47a', '#3a86ff'], inks: ['#3a86ff', '#ff5d5d', '#ffd23f'], finish: 'riso',
}, 'risoPop');
const GROUND = 900;
const PLATS = [[420, 700, 300], [880, 560, 260], [1320, 700, 300], [1760, 520, 280], [2200, 660, 340], [2700, 580, 300], [3150, 700, 420]];
const COINS = [[500, 580], [960, 440], [1400, 580], [1840, 400], [2280, 540], [2760, 460], [3230, 580], [3320, 580]];
function runner(c, x, y, tau, seed) {
  const [dy, sq] = hop(tau * 1.6, 1, 0);
  c.save(); c.translate(x, y); c.scale(1 / (sq || 1), sq || 1);
  draw(c, CI(0, -70, 76), PAL.fills[0], seed, { lw: 6, texo: { density: .35 } });
  draw(c, PG([[-76, -70], [-10, -70], [-44, -150]]), PAL.fills[0], seed + 1, { lw: 5, texo: { density: .3 } });
  draw(c, PG([[76, -70], [10, -70], [44, -150]]), PAL.fills[0], seed + 2, { lw: 5, texo: { density: .3 } });
  for (const s of [-1, 1]) { dot(c, s * 26, -86, 13, PAL.shade); dot(c, s * 26 - 4, -90, 5, PAL.light); }
  draw(c, EL(0, -46, 26, 16), PAL.blush, seed + 3, { tex: false, lw: 3 });
  for (const s of [-1, 1]) stroke(c, [[s * 30, 0], [s * 40 + Math.sin(tau * 12 + s) * 20, 44]], seed + 4 + s, { lw: 12, raw: true });
  c.restore();
}
function layers(c, camx, tau, i) {
  paper(c);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: PAL.fills[3], density: .12, cell: 16 });
  // far hills, mid trees, near platforms: three speeds
  c.save(); c.translate(-camx * .25, 0);
  for (let k = 0; k < 9; k++) { const x = k * 520; draw(c, PG([[x, GROUND], [x + 260, GROUND - 320], [x + 520, GROUND]]), tint(PAL.fills[1], .45), 10 + k, { lw: 5, texo: { density: .25 } }); }
  c.restore();
  c.save(); c.translate(-camx * .55, 0);
  for (let k = 0; k < 14; k++) { const x = k * 360 + 120; stroke(c, [[x, GROUND], [x, GROUND - 130]], 30 + k, { lw: 16, color: shade(PAL.fills[1], .35) }); draw(c, CI(x, GROUND - 200, 96), PAL.fills[1], 40 + k, { lw: 5, texo: { density: .3 } }); }
  c.restore();
}
function level(c, camx, tau, i, nameP) {
  c.save(); c.translate(-camx, 0);
  const g = rectPath(-200, GROUND, 5200, 400); c.fillStyle = PAL.fills[1]; c.fill(g); tex(c, g, [camx - 200, GROUND, W + 400, 400], { color: PAL.shade, density: .3, seed: 5 });
  stroke(c, [[-200, GROUND], [5000, GROUND]], 6, { lw: 8 });
  PLATS.forEach(([x, y, w], k) => { const p = RR(x, y, w, 56, 12); c.fillStyle = PAL.fills[4]; c.fill(p.path); tex(c, p.path, p.box, { color: PAL.shade, density: .35, seed: 50 + k }); stroke(c, p.pts, 60 + k, { raw: true, close: true, lw: 5 }); for (let b = 0; b < 3; b++) draw(c, CI(x + 40 + b * (w - 80) / 2, y + 28, 10), PAL.light, 70 + k * 3 + b, { tex: false, line: false }); });
  COINS.forEach(([x, y], k) => { const got = camx > x - 520; if (got) return; const s = pulse(i + k * 2, 8, 4) ? 1.1 : .95; draw(c, EL(x, y, 34 * s, 40), PAL.fills[0], 80 + k, { lw: 5, texo: { density: .4 } }); draw(c, EL(x, y, 16 * s, 22), PAL.light, 90 + k, { tex: false, lw: 3 }); });
  // the level sign at the end
  const sx = 3500;
  stroke(c, [[sx, GROUND], [sx, GROUND - 300]], 100, { lw: 18 });
  const bw = 820, bh = 250;
  c.fillStyle = alpha(PAL.shade, .2); c.beginPath(); c.roundRect(sx - bw / 2 + 14, GROUND - 300 - bh / 2 + 18, bw, bh, 16); c.fill();
  draw(c, RR(sx - bw / 2, GROUND - 300 - bh / 2, bw, bh, 16), PAL.fills[5], 101, { lw: 7, texo: { density: .2 } });
  if (nameP > 0) writeOn(c, 'platformer', sx, GROUND - 300 + 40, nameP, { size: 155, ink: PAL.ink, ink2: PAL.blush, pen: PAL.blush });
  else { textBar(c, sx - 260, GROUND - 340, 520, alpha(PAL.ink, .25), 24); textBar(c, sx - 160, GROUND - 270, 320, alpha(PAL.ink, .15), 20); }
  c.restore();
}
function runnerAt(t) {
  // x from the eased run, y from whichever platform is under it
  const x = lerp(240, 3320, sm(0, 3.1, t, easeIO));
  let y = GROUND;
  for (const [px, py, pw] of PLATS) if (x > px - 40 && x < px + pw + 40) y = Math.min(y, py);
  const [dy] = hop(t * 1.6, 1, 150);
  return [x, y + dy];
}
function sceneRun(c, tau, i) {
  const [rx, ry] = runnerAt(tau), camx = clamp(rx - 520, 0, 2600);
  layers(c, camx, tau, i);
  level(c, camx, tau, i, 0);
  runner(c, rx - camx, ry, tau, 110);
  speedLines(c, rx - camx - 90, ry - 70, Math.PI, 120 + i, 5, .4, PAL.light);
  // hud: coins collected
  draw(c, EL(90, 90, 30, 36), PAL.fills[0], 130, { lw: 5, tex: false });
  textBar(c, 140, 90, 120, alpha(PAL.ink, .6), 20);
}
function sceneSign(c, tau, i) {
  const camx = 2600, rx = 3320;
  layers(c, camx, tau, i);
  level(c, camx, tau, i, sm(.2, 1.1, tau, t => t));
  runner(c, rx - camx, GROUND - 56 + hop(tau * 1.6, 1, 60)[0], tau, 110);
  if (tau > .9) for (let k = 0; k < 5; k++) sparkle(c, 300 + k * 240, 300 + (k % 2) * 120, 30 + (pulse(i + k, 6, 3) ? 12 : 0), [PAL.fills[0], PAL.blush, PAL.fills[1]][k % 3], k);
  draw(c, EL(90, 90, 30, 36), PAL.fills[0], 130, { lw: 5, tex: false });
  textBar(c, 140, 90, 120, alpha(PAL.ink, .6), 20);
}

portfolioFilm({
  look: 'riso', palette: PAL_PF, poster: 4.6, crf: 29,
  beats: [
    { name: 'run', dur: 3.2, fn: sceneRun },
    { name: 'sign', dur: 1.8, fn: sceneSign },
  ],
});
</script>
