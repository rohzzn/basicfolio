<!doctype html>
<meta charset="utf-8">
<title>space</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Still Flying, a live spacecraft map and space dashboard.
// Look: riso on deep purple stock. Anchor: the probe. Signature: the camera orbits with the craft, and the
// craft's own trail writes the name across the sky.
// t     dur   scene   what changes                                                     kit
// 0.0   1.8   orbit   the earth turning, dashed orbits, craft sliding along them          dottedArc, hexCells
// 1.8   1.4   board   the dashboard panel: three live readouts climbing                    RR, bars
// 3.2   2.0   trail   one probe leaves orbit and its trail writes "still flying"            writeOn, speedLines

const PAL_SP = makePalette({
  paper: '#221b3d', paperBand: null, ink: '#f2ecff', night: '#150f2b', chalk: '#f2ecff', chalkDim: '#8a7fc0', guide: 'rgba(242,236,255,.3)',
  fills: ['#3a2f66', '#2ec4b6', '#ff6b6b', '#ffd166', '#5a4b9c', '#4cc9f0'], shade: '#150f2b', light: '#f2ecff', blush: '#ff6b6b',
  accents: ['#4cc9f0', '#ffd166', '#ff6b6b', '#2ec4b6'], inks: ['#4cc9f0', '#ff6b6b', '#ffd166'], finish: 'riso',
}, 'risoPop');

function starfield(c, i, seed) {
  paper(c);
  grain(c, rectPath(0, 0, W, H), [0, 0, W, H], 500, PAL.light, .55, seed, 3.4);
  const r = rng(seed + 1);
  for (let k = 0; k < 22; k++) { const x = r() * W, y = r() * H, s = 10 + r() * 16; sparkle(c, x, y, s * (pulse(i + k * 3, 11, 5) ? 1.3 : 1), k % 3 ? PAL.light : PAL.accents[0], r() * 2); }
}
function earth(c, x, y, R, spin, seed) {
  draw(c, CI(x, y, R), PAL.fills[1], seed, { lw: 7, texo: { color: PAL.shade, density: .3 } });
  c.save(); c.beginPath(); c.arc(x, y, R - 6, 0, TAU); c.clip();
  // continents as hex clusters, drifting with the spin
  const r = rng(seed + 2);
  for (let k = 0; k < 7; k++) {
    const a0 = r() * TAU, rr = r() * R * .7, cxk = x + Math.cos(a0 + spin) * rr, cyk = y + Math.sin(a0) * rr * .8, s = 40 + r() * 70;
    hexCells([cxk - s, cyk - s, s * 2, s * 2], 22, (hx, hy) => { if (Math.hypot(hx - cxk, hy - cyk) > s) return; c.fillStyle = k % 2 ? PAL.fills[3] : PAL.accents[3]; c.fill(hexPath(hx, hy, 21)); });
  }
  c.fillStyle = alpha(PAL.shade, .45); c.beginPath(); c.arc(x + R * .55, y - R * .2, R, 0, TAU); c.fill();
  c.restore();
}
function craft(c, x, y, rot, s, seed, o = {}) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  draw(c, RR(-34, -22, 68, 44, 12), PAL.light, seed, { lw: 5, texo: { density: .3, color: PAL.fills[4] } });
  for (const sy of [-1, 1]) draw(c, RR(-16, sy * 22, 32, sy * 46, 4), PAL.fills[5], seed + 1 + sy, { lw: 4, texo: { density: .5 } });
  draw(c, PG([[34, -14], [64, 0], [34, 14]]), PAL.accents[1], seed + 3, { lw: 4 });
  dot(c, -10, 0, 9, PAL.accents[0]);
  c.restore();
}
const ORB = [[380, 250, .1], [520, 340, -.25], [660, 430, .4]];
function sceneOrbit(c, tau, i) {
  starfield(c, i, 5);
  earth(c, CX, CY + 40, 250, tau * .6, 10);
  ORB.forEach(([rx, ry, rot], k) => {
    c.save(); c.translate(CX, CY + 40); c.rotate(rot);
    for (let j = 0; j < 2; j++) dottedArc(c, 0, 0, rx + j * 4, alpha(PAL.chalkDim, .7), 20 + k * 3 + j, 26, 3);
    const u = (tau * (.22 + k * .06) + k * .3) % 1, a = u * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    craft(c, x, y, a + Math.PI / 2, .9, 30 + k);
    c.restore();
  });
  for (let k = 0; k < 3; k++) { const a = -1.2 + k * .5; stroke(c, [[CX + Math.cos(a) * 270, CY + 40 + Math.sin(a) * 270], [CX + Math.cos(a) * 470, CY + 40 + Math.sin(a) * 470]], 40 + k, { lw: 3, dash: [16, 14], color: alpha(PAL.accents[0], .6) }); }
}
function panel(c, x, y, w, h, tau, seed) {
  draw(c, RR(x, y, w, h, 24), alpha(PAL.fills[0], .92), seed, { lw: 5, texo: { density: .25, color: PAL.shade } });
  textBar(c, x + 40, y + 50, 220, alpha(PAL.light, .7), 20);
  dot(c, x + w - 60, y + 50, 13, PAL.accents[3]);
  [[.7, PAL.accents[0]], [.45, PAL.accents[1]], [.86, PAL.accents[3]]].forEach(([v, col], k) => {
    const ry = y + 130 + k * 96;
    textBar(c, x + 40, ry, 120, alpha(PAL.light, .4), 14);
    draw(c, RR(x + 190, ry - 20, w - 250, 40, 20), alpha(PAL.light, .12), seed + 10 + k, { tex: false, lw: 3 });
    const p = sm(.1 + k * .12, .8 + k * .12, tau, easeOut);
    if (p > .02) draw(c, RR(x + 190, ry - 20, Math.max(40, (w - 250) * v * p), 40, 20), col, seed + 20 + k, { lw: 3, texo: { density: .4 } });
  });
  const sp = []; for (let k = 0; k <= 18; k++) sp.push([x + 40 + k * (w - 80) / 18, y + h - 70 - Math.sin(k * .7 + tau * 2) * 40 - 20]);
  strokeOn(c, sp, sm(.2, 1.1, tau), seed + 30, { lw: 5, color: PAL.accents[0], raw: true });
}
function sceneBoard(c, tau, i) {
  starfield(c, i, 5);
  earth(c, 220, CY + 260, 250, 1.1 + tau * .6, 10);
  ORB.forEach(([rx, ry, rot], k) => { c.save(); c.translate(220, CY + 260); c.rotate(rot); dottedArc(c, 0, 0, rx, alpha(PAL.chalkDim, .5), 20 + k, 26, 3); c.restore(); });
  const p = sm(0, .5, tau, easeOut);
  panel(c, lerp(W, CX - 140, p), 150, 800, 560, tau, 50);
  craft(c, 1040, 220, .4, 1.2, 60);
}
function sceneTrail(c, tau, i) {
  starfield(c, i, 5);
  earth(c, 180, CY + 400, 230, 2 + tau * .6, 10);
  const p = sm(.1, 1.5, tau, t => t);
  const [px, py] = writeOn(c, 'still flying', CX, CY - 40, p, { size: 175, ink: PAL.light, ink2: PAL.accents[0], pen: null });
  if (p < 1) { craft(c, px + 40, py - 10, .5, 1.1, 70); speedLines(c, px, py, Math.PI, 80 + i, 6, .5, PAL.accents[0]); }
  else { craft(c, CX + 520, CY - 260, -.4, 1.1, 70); dot(c, CX + 560, CY - 300, 12, PAL.accents[1]); }
  for (let r = 1; r <= 3; r++) dottedArc(c, 180, CY + 400, 250 + r * 60, alpha(PAL.chalkDim, .45), 90 + r, 26, 3);
  if (p > .5) for (let k = 0; k < 4; k++) sparkle(c, CX - 480 + k * 320, CY + 200, 24 + (pulse(i + k, 7, 3) ? 10 : 0), PAL.accents[k % 3], k);
}

portfolioFilm({
  look: 'riso', palette: PAL_SP, poster: 4.6, crf: 27,
  beats: [
    { name: 'orbit', dur: 1.8, fn: sceneOrbit },
    { name: 'board', dur: 1.4, fn: sceneBoard },
    { name: 'trail', dur: 2.0, fn: sceneTrail },
  ],
});
</script>
