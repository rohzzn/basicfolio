<!doctype html>
<meta charset="utf-8">
<title>hobby-music</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Music, the Spotify stats and the playlists.
// Look: riso, two loud inks on cream. Anchor: the record. Signature: the record turns for the whole film and
// the name is printed on its label, so the ending is just the camera finally looking straight at it.
// t     dur   scene  what changes                                                      kit
// 0.0   1.8   deck   the record drops onto the platter, the arm swings in, it spins       rotate, arm
// 1.8   1.4   bars   the top-artists bars grow out of the groove like an equaliser         RR bars
// 3.2   1.9   label  the camera settles on the label: "music"                               writeOn

const PAL_MU = makePalette({
  paper: '#f2ece0', paperBand: null, ink: '#231f2e', chalk: '#fffdf6', night: '#1b1826', chalkDim: '#8b84a3', guide: 'rgba(35,31,46,.3)',
  fills: ['#1db954', '#ff5c8a', '#ffd23f', '#5b6ee8', '#231f2e', '#f7f2e6'], shade: '#231f2e', light: '#fffdf6', blush: '#ff5c8a',
  accents: ['#1db954', '#ff5c8a', '#ffd23f', '#5b6ee8'], inks: ['#1db954', '#ff5c8a', '#231f2e'], finish: 'riso',
}, 'risoPop');
const RC = [CX - 60, CY + 20];

function record(c, cx, cy, R, spin, seed, nameP) {
  draw(c, CI(cx, cy, R), PAL.fills[4], seed, { lw: 6, texo: { density: .45, color: PAL.shade } });
  c.save(); c.beginPath(); c.arc(cx, cy, R - 6, 0, TAU); c.clip();
  // grooves, and one highlight that turns with the disc so the spin reads
  for (let r = R * .42; r < R; r += 14) { c.strokeStyle = alpha(PAL.light, .16); c.lineWidth = 2.4; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke(); }
  c.save(); c.translate(cx, cy); c.rotate(spin);
  c.strokeStyle = alpha(PAL.light, .3); c.lineWidth = 16; c.beginPath(); c.arc(0, 0, R * .78, -.5, .5); c.stroke();
  c.restore();
  c.restore();
  draw(c, CI(cx, cy, R * .38), PAL.fills[1], seed + 5, { lw: 5, texo: { density: .4 } });
  if (nameP > 0) writeOn(c, 'music', cx, cy + 22, nameP, { size: R * .3, ink: PAL.light, ink2: PAL.fills[2], pen: PAL.light });
  else { c.save(); c.translate(cx, cy); c.rotate(spin * .3); for (let k = 0; k < 3; k++) squig(c, -R * .22, -R * .1 + k * 26, R * .44, 1, { seed: seed + 10 + k, width: 4, amp: 7, color: alpha(PAL.light, .85) }); c.restore(); }
  draw(c, CI(cx, cy, R * .05), PAL.paper, seed + 20, { tex: false, lw: 3 });
}
function deck(c, tone) {
  paper(c);
  tex(c, rectPath(0, 0, W, H), [0, 0, W, H], { color: PAL.fills[2], density: .14, cell: 15 });
  const b = RR(70, 120, W - 140, H - 240, 30);
  c.fillStyle = PAL.fills[5]; c.fill(b.path); tex(c, b.path, b.box, { color: PAL.fills[3], density: .2, seed: 4 });
  stroke(c, b.pts, 5, { raw: true, close: true, lw: 7 });
  // the platter
  draw(c, CI(RC[0], RC[1], 330), tint(PAL.fills[4], .82), 6, { lw: 5, texo: { density: .2 } });
  if (tone) { for (let k = 0; k < 3; k++) draw(c, RR(W - 340, 220 + k * 90, 180, 46, 23), [PAL.fills[0], PAL.fills[1], PAL.fills[3]][k], 8 + k, { lw: 4, texo: { density: .35 } }); }
}
function arm(c, a, seed) {
  const px = W - 300, py = 300;
  draw(c, CI(px, py, 60), PAL.fills[4], seed, { lw: 5, texo: { density: .3 } });
  c.save(); c.translate(px, py); c.rotate(a);
  stroke(c, [[0, 0], [-40, 430]], seed + 1, { lw: 16, color: PAL.fills[4], raw: true });
  draw(c, RR(-62, 420, 46, 60, 8), PAL.fills[1], seed + 2, { lw: 4, texo: { density: .35 } });
  c.restore();
}
function sceneDeck(c, tau, i) {
  deck(c, false);
  const drop = sm(0, .55, tau, easeOut), spin = q12(tau) * 4.2;
  const y = lerp(RC[1] - 700, RC[1], drop);
  record(c, RC[0], y, 300, spin, 20, 0);
  arm(c, lerp(-.5, .28, sm(.5, 1.2, tau, easeIO)), 40);
  if (drop >= 1 && tau < .95) ringsOut(c, RC[0], RC[1], tau - .55, { every: 1 / 12, t1: .18, speed: 800, colors: [PAL.fills[0], PAL.fills[1]], width: 6, seed: 60, max: 520, r0: 300 });
  for (let k = 0; k < 3; k++) if (pulse(i + k * 2, 6, 3)) sparkle(c, 200 + k * 120, 240, 22, PAL.fills[2], k);
}
function sceneBars(c, tau, i) {
  deck(c, true);
  const spin = q12(1.8 + tau) * 4.2;
  record(c, RC[0], RC[1], 300, spin, 20, 0);
  arm(c, .28, 40);
  // the equaliser, growing out of the groove toward the right
  const vals = [.55, .82, .4, .95, .68, .5, .88];
  vals.forEach((v, k) => {
    const p = sm(k * .06, k * .06 + .45, tau, easeOut); if (p <= 0) return;
    const bh = 60 + v * 360 * p * (.92 + Math.sin(tau * 9 + k) * .08);
    const x = RC[0] + 380 + k * 78;
    draw(c, RR(x, RC[1] + 300 - bh, 56, bh, 28), [PAL.fills[0], PAL.fills[1], PAL.fills[2], PAL.fills[3]][k % 4], 70 + k, { lw: 4, texo: { density: .4 } });
  });
  textBar(c, RC[0] + 380, RC[1] + 350, 300, alpha(PAL.ink, .5), 20);
}
function sceneLabel(c, tau, i) {
  deck(c, true);
  const p = sm(0, .5, tau, easeIO), R = lerp(300, 430, p), spin = q12(3.2 + tau) * 4.2 * (1 - p * .7);
  const cx = lerp(RC[0], CX, p), cy = lerp(RC[1], CY, p);
  arm(c, .28, 40);
  record(c, cx, cy, R, spin, 20, sm(.45, 1.25, tau, t => t));
  if (tau > 1.3) for (let k = 0; k < 5; k++) { const a = k / 5 * TAU + tau; sparkle(c, cx + Math.cos(a) * (R + 140), cy + Math.sin(a) * (R + 110), 26 + (pulse(i + k, 7, 3) ? 10 : 0), [PAL.fills[0], PAL.fills[1], PAL.fills[2]][k % 3], a); }
}

portfolioFilm({
  look: 'riso', palette: PAL_MU, poster: 4.7, crf: 28,
  beats: [
    { name: 'deck', dur: 1.8, fn: sceneDeck },
    { name: 'bars', dur: 1.4, fn: sceneBars },
    { name: 'label', dur: 1.9, fn: sceneLabel },
  ],
});
</script>
