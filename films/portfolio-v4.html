<!doctype html>
<meta charset="utf-8">
<title>portfolio-v4</title>
<link rel="stylesheet" href="film.css">
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
// BRIEF
// Subject: Win95 Desktop (v4), the portfolio as a Windows 95 desktop.
// Look: flat, no texture at all - this one is pixels, not print. Anchor: the pointer.
// Signature: chunky bevelled windows cascading in, one every four frames, and the name in a title bar.
// t     dur   scene     what changes                                                   kit
// 0.0   1.4   desktop   icons on teal, the pointer double-clicks one                     flat fills
// 1.4   1.6   cascade   three windows pop up in a stagger, the last one charting           bevel RR
// 3.0   1.8   title     the front window's title bar is typed: "win95 desktop"             writeOn

const PAL_95 = makePalette({
  paper: '#008080', paperBand: null, ink: '#000000', night: '#000080', chalk: '#ffffff', chalkDim: '#808080', guide: 'rgba(0,0,0,.3)',
  fills: ['#c0c0c0', '#000080', '#ffffff', '#808080', '#ff0000', '#ffff00'], shade: '#808080', light: '#ffffff', blush: '#ff0000',
  accents: ['#000080', '#ff0000', '#ffff00', '#00ff00'], inks: ['#000080', '#ff0000'], finish: 'flat',
}, 'screenSea');

function bevel(c, x, y, w, h, out = true) {
  c.fillStyle = PAL.fills[0]; c.fillRect(x, y, w, h);
  c.fillStyle = out ? PAL.light : PAL.fills[3]; c.fillRect(x, y, w, 6); c.fillRect(x, y, 6, h);
  c.fillStyle = out ? PAL.fills[3] : PAL.light; c.fillRect(x, y + h - 6, w, 6); c.fillRect(x + w - 6, y, 6, h);
  c.fillStyle = PAL.ink; c.fillRect(x, y + h, w + 6, 6); c.fillRect(x + w, y, 6, h + 6);
}
function win95(c, x, y, w, h, k, seed, titleP) {
  bevel(c, x, y, w, h);
  c.fillStyle = PAL.fills[1]; c.fillRect(x + 10, y + 10, w - 20, 60);
  if (titleP > 0) writeOn(c, 'win95 desktop', x + 30, y + 58, titleP, { size: 52, align: 'left', ink: PAL.light, ink2: null, pen: PAL.fills[5] });
  else textBar(c, x + 30, y + 40, 220, alpha(PAL.light, .9), 18);
  for (let b = 0; b < 3; b++) { bevel(c, x + w - 40 - (2 - b) * 54, y + 18, 44, 44); c.fillStyle = PAL.ink; c.fillRect(x + w - 30 - (2 - b) * 54, y + 36, 24, b === 2 ? 5 : 4); if (b === 1) { c.strokeStyle = PAL.ink; c.lineWidth = 4; c.strokeRect(x + w - 32 - (2 - b) * 54, y + 26, 28, 26); } }
  c.fillStyle = PAL.light; c.fillRect(x + 10, y + 80, w - 20, h - 96);
  c.strokeStyle = PAL.fills[3]; c.lineWidth = 3; c.strokeRect(x + 10, y + 80, w - 20, h - 96);
  if (k === 0) { squig(c, x + 40, y + 140, w - 100, 5, { seed, lineH: 56, width: 5, color: PAL.ink }); }
  if (k === 1) { for (let r = 0; r < 4; r++) for (let q = 0; q < 3; q++) { c.fillStyle = [PAL.fills[1], PAL.blush, PAL.fills[5], PAL.accents[3]][(r + q) % 4]; c.fillRect(x + 50 + q * 120, y + 120 + r * 90, 60, 60); } }
  if (k === 2) { const bars = [.4, .75, .55, .95, .7]; bars.forEach((v, b) => { const bh = (h - 200) * v; c.fillStyle = [PAL.fills[1], PAL.blush, PAL.fills[5], PAL.accents[3], PAL.fills[3]][b]; c.fillRect(x + 60 + b * 96, y + h - 60 - bh, 70, bh); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.strokeRect(x + 60 + b * 96, y + h - 60 - bh, 70, bh); }); }
}
function desktop(c, tau, i, dbl) {
  resetT(c); c.fillStyle = PAL.paper; c.fillRect(0, 0, W, H);
  const icons = [[90, 90, PAL.fills[2]], [90, 300, PAL.fills[5]], [90, 510, PAL.blush], [90, 720, PAL.fills[1]]];
  icons.forEach(([x, y, col], k) => {
    const on = k === 1 && dbl;
    c.fillStyle = col; c.fillRect(x, y, 96, 76);
    c.strokeStyle = PAL.ink; c.lineWidth = 4; c.strokeRect(x, y, 96, 76);
    c.fillStyle = PAL.light; c.fillRect(x + 14, y + 16, 68, 14); c.fillRect(x + 14, y + 40, 44, 14);
    if (on) { c.fillStyle = alpha(PAL.fills[1], .55); c.fillRect(x - 8, y - 8, 112, 92); }
    c.fillStyle = on ? PAL.fills[1] : alpha(PAL.ink, .55); c.fillRect(x + 4, y + 88, 88, 20);
  });
  // taskbar
  bevel(c, -6, H - 78, W + 12, 84);
  bevel(c, 14, H - 64, 190, 56);
  c.fillStyle = PAL.ink; c.fillRect(34, H - 46, 24, 20); c.fillStyle = PAL.blush; c.fillRect(40, H - 52, 24, 20);
  textBar(c, 84, H - 36, 100, alpha(PAL.ink, .8), 16);
  bevel(c, W - 220, H - 64, 200, 56, false);
  textBar(c, W - 190, H - 36, 100, alpha(PAL.ink, .6), 14);
}
function sceneDesktop(c, tau, i) {
  const dbl = tau > .75;
  desktop(c, tau, i, dbl);
  const t = sm(.1, .7, tau, easeIO), x = lerp(700, 150, t), y = lerp(760, 350, t);
  const press = (tau > .75 && tau < .75 + 1 / 12) || (tau > .92 && tau < .92 + 1 / 12);
  c.save(); if (press) { c.translate(x, y); c.scale(.92, .92); c.translate(-x, -y); }
  cursor(c, x, y, 120, PAL.light, 10, { lc: PAL.ink, lw: 6, tex: false });
  c.restore();
}
const WINS = [[210, 150, 700, 520], [330, 300, 760, 560], [470, 420, 820, 580]];
function sceneCascade(c, tau, i) {
  desktop(c, tau, i, false);
  WINS.forEach(([x, y, w, h], k) => { const p = easeBack(sm(k * 4 / 12, k * 4 / 12 + .3, tau, t => t)); if (p <= .02) return;
    c.save(); c.translate(x + w / 2, y + h / 2); c.scale(p, p); c.translate(-x - w / 2, -y - h / 2); win95(c, x, y, w, h, k, 20 + k * 5, 0); c.restore(); });
  cursor(c, 150, 350, 120, PAL.light, 10, { lc: PAL.ink, lw: 6, tex: false });
}
function sceneTitle(c, tau, i) {
  desktop(c, tau, i, false);
  WINS.forEach(([x, y, w, h], k) => win95(c, x, y, w, h, k, 20 + k * 5, k === 2 ? sm(.1, 1.0, tau, t => t) : 0));
  const [x, y, w, h] = WINS[2];
  if (tau > 1.05) { for (let k = 0; k < 4; k++) { const g = sm(1.05 + k * .06, 1.2 + k * .06, tau); if (g > 0) { c.strokeStyle = PAL.fills[5]; c.lineWidth = 6; c.strokeRect(x - 10 - k * 14 * g, y - 10 - k * 14 * g, w + 20 + k * 28 * g, h + 20 + k * 28 * g); } } }
  cursor(c, x + w - 120, y + 50, 120, PAL.light, 10, { lc: PAL.ink, lw: 6, tex: false });
}

portfolioFilm({
  look: 'screen', palette: PAL_95, poster: 4.3,
  beats: [
    { name: 'desktop', dur: 1.4, fn: sceneDesktop },
    { name: 'cascade', dur: 1.6, fn: sceneCascade },
    { name: 'title', dur: 1.8, fn: sceneTitle },
  ],
});
</script>
