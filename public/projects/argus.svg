  <text x="56" y="276" fill="#a2968a" font-family="system-ui,sans-serif" font-size="14">Moderation, music, levels and games,</text>
  <text x="56" y="296" fill="#a2968a" font-family="system-ui,sans-serif" font-size="14">with every change written down.</text>

